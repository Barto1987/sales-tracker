][0-9]{2})\s*€/i);if(dm)disc=n(dm[1]);let v=base+promo+int+disc+uc+ss,conf=/VF Expert|indirizzi IP/i.test(b)?'yellow':'green';if(conf==='yellow')warn.push('Servizi aggiuntivi One Net da verificare.');add({service:svc,qty:1,val:v,conf,calc:`Canone ${money(base)}${promo?'\nPromo − '+money(Math.abs(promo)):''}${int?'\nInterni + '+money(int):''}${disc?'\nSconto grandi clienti − '+money(Math.abs(disc)):''}${uc?'\nUC Phone + '+money(uc):''}${ss?'\nSempre Serviti + '+money(ss):''}\nDevice e contributo attivazione esclusi\nInflow = ${money(v)}`})}}}return{c,rows,warn,conf:rows.length?((rows.some(r=>r.conf==='yellow'||r.manual)||warn.length)?'yellow':'green'):'red',file}}
function show(){let p=parsed;$('previewBox').classList.remove('hidden');$('common').innerHTML=`<strong>${p.c.client||'Cliente da verificare'}</strong><br>P.IVA ${p.c.vat||'—'} · Offerta ${p.c.offer||'—'}${p.warn.length?'<br>'+p.warn.map(x=>'⚠️ '+x).join('<br>'):''}`;$('conf').className='badge '+p.conf;$('conf').textContent=p.conf==='green'?'🟢 Alta affidabilità':p.conf==='yellow'?'🟡 Verifica richiesta':'🔴 Manuale';$('rows').innerHTML=p.rows.map(r=>`<div class="preview"><div class="row"><div><label>Servizio</label><select class="ps">${['SIM Voce','SIM Dati','Easy Rent','ADSL','One Net Ufficio','One Net Azienda','Energia','Gas','Altro'].map(x=>`<option ${x===r.service?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Quantità</label><input class="pq" type="number" value="${r.qty}"></div></div><label>${r.manual?'Inflow manuale unitario €':'Inflow unitario €'}</label><input class="pv" type="number" step="0.01" value="${r.val||''}"><div class="calc">${r.calc}</div><div class="actions" style="margin-top:8px"><span class="badge ${r.conf}">${r.conf==='green'?'🟢 Riconosciuto':'🟡 Controlla'}</span><button class="danger del" type="button">Rimuovi</button></div></div>`).join('');document.querySelectorAll('.del').forEach(b=>b.onclick=()=>b.closest('.preview').remove())}
$('pdfInput').onchange=async e=>{let f=e.target.files[0];if(!f)return;$('pdfMsg').textContent='Analisi in corso…';try{parsed=parse(await pdfText(f),f.name);show();$('pdfMsg').textContent=`Analisi completata: ${parsed.rows.length} righe proposte.`}catch(err){console.error(err);$('pdfMsg').textContent='PDF non leggibile automaticamente.'}};$('saveAll').onclick=()=>{let rs=[...document.querySelectorAll('.preview')];for(let r of rs){if(r.querySelector('.ps').value==='Easy Rent'&&Number(r.querySelector('.pv').value||0)<=0)return alert('Inserisci l’inflow Easy Rent.')}let d=new Date().toISOString().slice(0,10);for(let r of rs)data.push({id:String(Date.now())+Math.random(),date:d,offer:parsed.c.offer,client:parsed.c.client||'Da verificare',vat:parsed.c.vat,service:r.querySelector('.ps').value,qty:Number(r.querySelector('.pq').value||1),monthly:Number(r.querySelector('.pv').value||0),status:'Valido',pdfRef:parsed.file,notes:'Analisi PDF v1.2'});save();render();$('previewBox').classList.add('hidden');alert('Righe salvate');document.querySelector('[data-v=dashboard]').click()};
