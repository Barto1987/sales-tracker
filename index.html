<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e60000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sales Tracker</title>
<style>
:root{--red:#e60000;--bg:#f4f5f7;--card:#fff;--text:#111;--muted:#6b7280;--green:#15803d;--amber:#b45309;--danger:#b91c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
header{position:sticky;top:0;z-index:5;background:var(--red);color:white;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;font-size:22px;font-weight:800}
main{max-width:900px;margin:auto;padding:14px 14px 95px}
nav{position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:white;padding:12px 4px;font-size:12px}
nav button.active{color:var(--red);font-weight:800}
.view{display:none}.view.active{display:block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:16px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:12px}
.kpi strong{display:block;font-size:24px;margin:6px 0}
.small,.muted{color:var(--muted);font-size:13px}
.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;background:var(--red)}
h2{margin:6px 0 14px} h3{margin:0 0 10px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:16px;background:white}
textarea{min-height:80px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;border:0;background:var(--red);color:white;font-weight:800;padding:14px;border-radius:12px;font-size:16px;margin-top:16px}
.secondary{border:1px solid #d1d5db;background:white;padding:10px 12px;border-radius:10px;font-weight:700}
.danger{border:0;background:#fee2e2;color:var(--danger);padding:9px 11px;border-radius:10px;font-weight:700}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#eee}
.ok{background:#dcfce7;color:var(--green)} .warn{background:#fef3c7;color:var(--amber)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:12px;font-size:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>Sales Tracker</header>
<main>
<section id="dashboard" class="view active">
<h2>Dashboard</h2>
<div id="kpis" class="grid"></div>
<div class="card"><h3>Ultimi inserimenti</h3><div id="latest"></div></div>
</section>

<section id="new" class="view">
<h2>Nuovo contratto</h2>
<form id="form" class="card">
<div class="row"><div><label>Data</label><input id="date" type="date" required></div><div><label>N. offerta</label><input id="offer"></div></div>
<label>Cliente</label><input id="client" required>
<label>Partita IVA</label><input id="vat">
<label>Servizio</label>
<select id="service" required>
<option value="">Seleziona</option>
<option>SIM Voce</option><option>SIM Dati</option><option>Easy Rent</option>
<option>ADSL</option><option>One Net Ufficio</option><option>One Net Azienda</option>
<option>Energia</option><option>Gas</option><option>Altro</option>
</select>
<div class="row">
<div><label>Quantità</label><input id="qty" type="number" min="1" step="1" value="1" required></div>
<div><label>Canone netto unitario €</label><input id="monthly" type="number" min="0" step="0.01" value="0"></div>
</div>
<div class="row">
<div><label>Costo device unitario €</label><input id="device" type="number" min="0" step="0.01" value="0"></div>
<div><label>Inflow manuale unitario €</label><input id="manual" type="number" min="0" step="0.01" placeholder="Per Easy Rent o correzioni"></div>
</div>
<div class="row">
<div><label>Nuovo cliente</label><select id="newClient"><option>No</option><option>Sì</option></select></div>
<div><label>PDA digitale</label><select id="pda"><option>No</option><option>Sì</option></select></div>
</div>
<label>Stato</label><select id="status"><option>Valido</option><option>Rettificato</option><option>Annullato</option></select>
<label>Riferimento PDF</label><input id="pdfRef" placeholder="Nome del file">
<label>Note</label><textarea id="notes"></textarea>
<button class="primary" type="submit">Salva contratto</button>
</form>
<div class="notice">Per offerte con più servizi inserisci una riga separata per ogni servizio.</div>
</section>

<section id="contracts" class="view">
<h2>Contratti</h2>
<div class="card"><input id="search" placeholder="Cerca cliente, servizio o offerta"></div>
<div id="list"></div>
</section>

<section id="residual" class="view">
<h2>Residuo</h2>
<div id="residualList"></div>
<div class="card">
<h3>Backup</h3>
<div class="actions">
<button class="secondary" onclick="exportData()">Esporta</button>
<label class="secondary" style="margin:0;cursor:pointer">Importa<input id="importFile" type="file" accept=".json" style="display:none"></label>
<button class="danger" onclick="resetData()">Cancella dati</button>
</div>
</div>
</section>
</main>

<nav>
<button class="active" data-view="dashboard">Dashboard</button>
<button data-view="new">Nuovo</button>
<button data-view="contracts">Contratti</button>
<button data-view="residual">Residuo</button>
</nav>

<script>
const TARGETS={piecesCore:40,inflowCore:500,adsl:8,oneNet:8,energyGas:10};
const START=new Date('2026-07-01T00:00:00'),END=new Date('2026-09-30T23:59:59');
let contracts=JSON.parse(localStorage.getItem('salesTrackerContracts')||'[]');
const $=id=>document.getElementById(id);
function save(){localStorage.setItem('salesTrackerContracts',JSON.stringify(contracts))}
function money(v){return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(v||0)}
function inPeriod(c){const d=new Date(c.date+'T12:00:00');return c.status!=='Annullato'&&d>=START&&d<=END}
function unitInflow(c){
 if(c.status==='Annullato')return 0;
 if(c.manual!==''&&c.manual!==null&&!isNaN(Number(c.manual)))return Number(c.manual);
 const m=Number(c.monthly||0),dev=Number(c.device||0);
 if(['SIM Voce','SIM Dati'].includes(c.service))return m;
 if(c.service==='Easy Rent')return 0;
 if(c.service==='One Net Ufficio')return Math.max(m-5-dev,0);
 if(c.service==='One Net Azienda')return Math.max(m-10-dev,0);
 if(c.service==='ADSL')return Math.max(m-dev,0);
 if(['Energia','Gas'].includes(c.service))return 80;
 return 0;
}
function totalInflow(c){return unitInflow(c)*Number(c.qty||0)}
function stats(){
 const v=contracts.filter(inPeriod);
 return {
  piecesCore:v.filter(c=>['SIM Voce','SIM Dati','Easy Rent'].includes(c.service)).reduce((a,c)=>a+Number(c.qty),0),
  inflowCore:v.filter(c=>['SIM Voce','SIM Dati','Easy Rent'].includes(c.service)).reduce((a,c)=>a+totalInflow(c),0),
  adsl:v.filter(c=>c.service==='ADSL').reduce((a,c)=>a+Number(c.qty),0),
  oneNet:v.filter(c=>['One Net Ufficio','One Net Azienda'].includes(c.service)).reduce((a,c)=>a+Number(c.qty),0),
  energyGas:v.filter(c=>['Energia','Gas'].includes(c.service)).reduce((a,c)=>a+Number(c.qty),0)
 }
}
function kpi(label,val,target,euro=false){
 const pct=Math.min(val/target*100,100);
 return `<div class="card kpi"><div class="small">${label}</div><strong>${euro?money(val):val} / ${euro?money(target):target}</strong><div class="progress"><span style="width:${pct}%"></span></div><div class="small">Residuo: ${euro?money(Math.max(target-val,0)):Math.max(target-val,0)}</div></div>`
}
function item(c,actions=true){
 return `<div class="card"><div class="item"><div><strong>${c.client}</strong><div class="muted">${c.service} · Qtà ${c.qty}</div><div class="muted">${c.offer||'Senza offerta'} · ${c.date}</div></div><div style="text-align:right"><strong>${money(totalInflow(c))}</strong><br><span class="badge ${c.status==='Valido'?'ok':'warn'}">${c.status}</span></div></div>${actions?`<div class="actions"><button class="secondary" onclick="editContract('${c.id}')">Modifica</button><button class="danger" onclick="deleteContract('${c.id}')">Elimina</button></div>`:''}</div>`
}
function render(){
 const s=stats();
 $('kpis').innerHTML=kpi('SIM + Dati + Easy Rent',s.piecesCore,TARGETS.piecesCore)+kpi('Inflow Core',s.inflowCore,TARGETS.inflowCore,true)+kpi('ADSL',s.adsl,TARGETS.adsl)+kpi('One Net',s.oneNet,TARGETS.oneNet)+kpi('Energia + Gas',s.energyGas,TARGETS.energyGas);
 const recent=[...contracts].reverse().slice(0,5);$('latest').innerHTML=recent.length?recent.map(c=>item(c,false)).join(''):'<div class="muted">Nessun contratto.</div>';
 renderList();
 const rows=[['SIM Voce/Dati + Easy Rent',s.piecesCore,TARGETS.piecesCore,'pezzi'],['Inflow Core',s.inflowCore,TARGETS.inflowCore,'€'],['ADSL',s.adsl,TARGETS.adsl,'pezzi'],['One Net',s.oneNet,TARGETS.oneNet,'pezzi'],['Energia/Gas',s.energyGas,TARGETS.energyGas,'contratti']];
 $('residualList').innerHTML=rows.map(r=>{const rem=Math.max(r[2]-r[1],0),ok=rem===0;return `<div class="card"><div class="item"><div><strong>${r[0]}</strong><div class="muted">${r[3]==='€'?money(r[1]):r[1]} su ${r[3]==='€'?money(r[2]):r[2]}</div></div><span class="badge ${ok?'ok':'warn'}">${ok?'Raggiunto':'Da completare'}</span></div><div style="font-size:18px;font-weight:800">${ok?'Obiettivo raggiunto':'Mancano '+(r[3]==='€'?money(rem):rem+' '+r[3])}</div></div>`}).join('');
}
function renderList(){const q=($('search').value||'').toLowerCase();const arr=[...contracts].reverse().filter(c=>(c.client+' '+c.offer+' '+c.service).toLowerCase().includes(q));$('list').innerHTML=arr.length?arr.map(c=>item(c,true)).join(''):'<div class="card muted">Nessun risultato.</div>'}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.view).classList.add('active');window.scrollTo(0,0)});
$('search').oninput=renderList;$('date').valueAsDate=new Date();
$('form').onsubmit=e=>{e.preventDefault();const id=e.target.dataset.editing||String(Date.now());const c={id,date:$('date').value,offer:$('offer').value.trim(),client:$('client').value.trim(),vat:$('vat').value.trim(),service:$('service').value,qty:Number($('qty').value||1),monthly:Number($('monthly').value||0),device:Number($('device').value||0),manual:$('manual').value===''?'':Number($('manual').value),newClient:$('newClient').value,pda:$('pda').value,status:$('status').value,pdfRef:$('pdfRef').value.trim(),notes:$('notes').value.trim()};if(e.target.dataset.editing){contracts=contracts.map(x=>x.id===id?c:x);delete e.target.dataset.editing}else contracts.push(c);save();e.target.reset();$('date').valueAsDate=new Date();$('qty').value=1;$('monthly').value=0;$('device').value=0;$('status').value='Valido';render();document.querySelector('[data-view="dashboard"]').click();alert('Contratto salvato')};
function editContract(id){const c=contracts.find(x=>x.id===id);if(!c)return;$('form').dataset.editing=id;for(const k of ['date','offer','client','vat','service','qty','monthly','device','manual','newClient','pda','status','pdfRef','notes'])$(k).value=c[k];document.querySelector('[data-view="new"]').click()}
function deleteContract(id){if(!confirm('Eliminare il contratto?'))return;contracts=contracts.filter(c=>c.id!==id);save();render()}
function exportData(){const blob=new Blob([JSON.stringify(contracts,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sales-tracker-backup.json';a.click()}
$('importFile').onchange=async e=>{try{contracts=JSON.parse(await e.target.files[0].text());save();render();alert('Backup importato')}catch{alert('File non valido')}}
function resetData(){if(!confirm('Cancellare tutti i dati?'))return;contracts=[];save();render()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
render();
</script>
</body>
</html>
