<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e60000">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css?v=206">
<title>Sales Tracker 2.0.6</title>
</head>
<body>
<header><div class="title">Sales Tracker 2.0.6</div><div class="sub">Cruscotto commerciale personale</div></header>
<main>
<section id="home" class="view active">
<h2>Home</h2><div id="homeTop"></div><div id="homeCards" class="grid"></div>
<div class="card"><h3>Backup e migrazione</h3><div class="actions"><button id="exportBtn" class="secondary">Esporta backup 2.0</button><label class="secondary" style="margin:0;cursor:pointer">Importa backup<input id="importInput" type="file" accept=".json" style="display:none"></label></div></div>
</section>

<section id="new" class="view">
<h2>Nuovo contratto</h2>
<div class="pdfbox"><h3>Carica offerta PDF</h3><input id="pdfInput" type="file" accept="application/pdf"><div id="pdfLoader" class="loader">Analisi in corso…</div><div id="pdfStatus" class="muted" style="margin-top:10px">Il PDF viene letto localmente.</div></div>
<div id="previewBox" class="hidden">
<div class="card"><div class="item"><h3>Anteprima</h3><span id="confidenceBadge" class="badge"></span></div><div id="previewMeta" class="muted"></div><div id="previewRows"></div>
<div class="row"><div><label>Prospect</label><select id="prospect"><option>No</option><option>Sì</option></select></div><div id="mnpWrap"><label>MNP</label><select id="mnp"><option>No</option><option>Sì</option></select></div></div>
<label>Data contratto</label><input id="contractDate" type="date">
<button id="saveParsed" class="primary">Conferma e salva</button></div>
</div>
</section>

<section id="agency" class="view"><h2>Gara Agenzia</h2><div id="agencyGrid" class="grid"></div></section>

<section id="excellent" class="view"><h2>Excellent</h2><div id="excellentSummary"></div><div id="excellentGrid" class="grid"></div><div class="card"><h3>Storico trimestri</h3><div id="excellentHistory"></div></div></section>

<section id="community" class="view"><h2>Community</h2><div id="communitySummary"></div><div id="communityBoosts"></div><div id="communityCompare"></div></section>

<section id="archive" class="view"><h2>Archivio</h2><div class="card"><input id="archiveSearch" placeholder="Cerca cliente, P.IVA, offerta o prodotto"></div><div id="archiveList"></div></section>
</main>
<nav>
<button class="active" data-view="home">Home</button>
<button data-view="new">Nuovo</button>
<button data-view="agency">Agenzia</button>
<button data-view="excellent">Excellent</button>
<button data-view="community">Community</button>
</nav>
<script type="module" src="app.js?v=206"></script>
<script>
(async()=>{
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    for(const r of regs) await r.unregister();
  }
  if('caches' in window){
    const keys=await caches.keys();
    for(const k of keys) await caches.delete(k);
  }
})();
</script>
</body>
</html>
